<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F472B6" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background gentle round badge -->
  <circle cx="50" cy="50" r="46" fill="#FFF1F5" stroke="#FCE7F3" stroke-width="2"/>
  <!-- Cozy Crochet Yarn Ball / Puff Stitch Motif -->
  <path d="M50 20 C34 20 22 32 22 48 C22 64 34 76 50 76 C66 76 78 64 78 48 C78 32 66 20 50 20 Z" fill="none" stroke="url(#pinkGrad)" stroke-width="5" stroke-linecap="round"/>
  <!-- Yarn loops / Puff swirl lines -->
  <path d="M30 46 C36 34 50 32 58 40 C66 48 56 64 42 62 C34 60 32 50 38 42 C44 36 54 36 60 42 C66 48 64 56 56 60" fill="none" stroke="url(#pinkGrad)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="0.5 1"/>
  <!-- Crochet Hook crossing through -->
  <g transform="rotate(42 50 50)">
    <line x1="18" y1="50" x2="80" y2="50" stroke="#9D174D" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Ergonomic Hook grip -->
    <rect x="22" y="47" width="28" height="6" rx="3" fill="#EC4899"/>
    <!-- Hook Tip curve -->
    <path d="M80 50 C83 50 85 47 83 44 C81 42 77 44 76 46" fill="none" stroke="#9D174D" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- Tiny sparkle stars -->
  <circle cx="74" cy="26" r="3" fill="#EC4899" filter="url(#softGlow)"/>
  <circle cx="26" cy="72" r="2.5" fill="#F472B6"/>
</svg>