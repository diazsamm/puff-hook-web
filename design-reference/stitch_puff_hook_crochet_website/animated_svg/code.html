<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_SVG_START:ANIMATION_2 class="fixed inset-0 w-full h-full" --><div class="fixed inset-0 w-full h-full" id="animated-svg-ANIMATION_2" style="display:block;"><svg height="100%" viewbox="0 0 600 400" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
      @keyframes floatYarn {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(3deg); }
      }
      @keyframes gentlePulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }
      @keyframes stitchWave {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 100; }
      }
      @keyframes sparkle {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      @keyframes hookMove {
        0%, 100% { transform: translate(0, 0) rotate(-25deg); }
        50% { transform: translate(-8px, -14px) rotate(-18deg); }
      }
      .yarn-ball { transform-origin: center; animation: floatYarn 4.5s ease-in-out infinite; }
      .puff-stitch { transform-origin: center; animation: gentlePulse 3.5s ease-in-out infinite; }
      .yarn-strand { stroke-dasharray: 8 6; animation: stitchWave 4s linear infinite; }
      .sparkle-1 { transform-origin: 120px 100px; animation: sparkle 2.4s ease-in-out infinite; }
      .sparkle-2 { transform-origin: 480px 140px; animation: sparkle 3.1s ease-in-out infinite 0.8s; }
      .sparkle-3 { transform-origin: 360px 80px; animation: sparkle 2.8s ease-in-out infinite 0.4s; }
      .crochet-hook { transform-origin: 340px 180px; animation: hookMove 3.8s ease-in-out infinite; }
    </style>
<lineargradient id="pinkBall" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#FBCFE8"></stop>
<stop offset="50%" stop-color="#F472B6"></stop>
<stop offset="100%" stop-color="#DB2777"></stop>
</lineargradient>
<lineargradient id="puffGrad" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#FFF1F2"></stop>
<stop offset="100%" stop-color="#FCE7F3"></stop>
</lineargradient>
<filter height="140%" id="softShadow" width="140%" x="-20%" y="-20%">
<fedropshadow dx="0" dy="12" flood-color="#F472B6" flood-opacity="0.25" stddeviation="15"></fedropshadow>
</filter>
</defs>
<!-- Background decorative pastel circles -->
<circle cx="300" cy="200" fill="#FFF5F7" opacity="0.8" r="170"></circle>
<circle cx="210" cy="160" fill="#FDF2F8" opacity="0.6" r="90"></circle>
<circle cx="390" cy="230" fill="#FCE7F3" opacity="0.5" r="110"></circle>
<!-- Flowing yarn decorative trails -->
<path class="yarn-strand" d="M 60 280 C 140 240, 180 340, 260 270 S 370 200, 440 280 S 520 230, 560 260" fill="none" opacity="0.7" stroke="#F472B6" stroke-linecap="round" stroke-width="4"></path>
<path class="yarn-strand" d="M 100 130 C 170 90, 230 140, 310 110 S 430 70, 500 120" fill="none" opacity="0.5" stroke="#FDA4AF" stroke-linecap="round" stroke-width="3"></path>
<!-- Center Yarn Ball & Amigurumi Silhouette -->
<g class="yarn-ball" filter="url(#softShadow)">
<!-- Yarn Ball Base -->
<ellipse cx="260" cy="220" fill="url(#pinkBall)" rx="90" ry="85"></ellipse>
<!-- Yarn winding lines -->
<path d="M 190 190 C 220 160, 280 170, 310 210 C 330 240, 310 280, 260 290" fill="none" opacity="0.75" stroke="#FFF" stroke-linecap="round" stroke-width="5"></path>
<path d="M 210 240 C 240 270, 290 260, 320 220 C 340 180, 290 160, 240 170" fill="none" opacity="0.85" stroke="#FCE7F3" stroke-linecap="round" stroke-width="4"></path>
<path d="M 230 160 C 270 190, 270 250, 220 275" fill="none" opacity="0.5" stroke="#F43F5E" stroke-linecap="round" stroke-width="3.5"></path>
<path d="M 180 220 C 210 210, 280 205, 330 230" fill="none" opacity="0.7" stroke="#FFF" stroke-linecap="round" stroke-width="4"></path>
</g>
<!-- Puff Flower / Cloud Motif -->
<g class="puff-stitch" transform="translate(370, 160)">
<!-- 5 Puff Petals -->
<circle cx="0" cy="-35" fill="url(#puffGrad)" r="26" stroke="#F472B6" stroke-width="3"></circle>
<circle cx="33" cy="-11" fill="url(#puffGrad)" r="26" stroke="#F472B6" stroke-width="3"></circle>
<circle cx="21" cy="30" fill="url(#puffGrad)" r="26" stroke="#F472B6" stroke-width="3"></circle>
<circle cx="-21" cy="30" fill="url(#puffGrad)" r="26" stroke="#F472B6" stroke-width="3"></circle>
<circle cx="-33" cy="-11" fill="url(#puffGrad)" r="26" stroke="#F472B6" stroke-width="3"></circle>
<!-- Center button -->
<circle cx="0" cy="0" fill="#F43F5E" r="16"></circle>
<circle cx="0" cy="0" fill="#FFF" r="7"></circle>
</g>
<!-- Interactive Crochet Hook (Puff Hook) -->
<g class="crochet-hook">
<!-- Hook Rod -->
<rect fill="#9D174D" height="180" rx="6" transform="rotate(-30 290 70)" width="12" x="290" y="70"></rect>
<!-- Ergonomic Soft Pink Grip -->
<rect fill="#EC4899" height="90" rx="10" transform="rotate(-30 290 70)" width="20" x="286" y="140"></rect>
<rect fill="#F472B6" height="45" rx="7" transform="rotate(-30 290 70)" width="14" x="289" y="160"></rect>
<!-- Metallic Hook Lip -->
<path d="M 230 65 C 235 55, 245 56, 248 62 C 250 67, 242 72, 238 68" fill="none" stroke="#9D174D" stroke-linecap="round" stroke-width="6"></path>
</g>
<!-- Cute Sparkles -->
<g class="sparkle-1">
<path d="M 120 90 Q 120 100 110 100 Q 120 100 120 110 Q 120 100 130 100 Q 120 100 120 90 Z" fill="#EC4899"></path>
</g>
<g class="sparkle-2">
<path d="M 480 130 Q 480 140 470 140 Q 480 140 480 150 Q 480 140 490 140 Q 480 140 480 130 Z" fill="#F43F5E"></path>
</g>
<g class="sparkle-3">
<path d="M 360 70 Q 360 80 350 80 Q 360 80 360 90 Q 360 80 370 80 Q 360 80 360 70 Z" fill="#F472B6"></path>
</g>
</svg></div><!-- STITCH_SVG_END:ANIMATION_2 -->
</body>
</html>
